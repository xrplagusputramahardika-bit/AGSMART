<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF5200"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0E6"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5200" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with subtle shadow -->
  <rect x="4" y="4" width="72" height="72" rx="20" fill="url(#bgGrad)" filter="url(#softGlow)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="5.5" y="5.5" width="69" height="69" rx="18.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Shopping Bag Handle (Top Arch) -->
  <path d="M28 29 C28 20, 52 20, 52 29" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Shopping Bag / Smart Monogram Body -->
  <path d="M22 30 L58 30 C61 30, 63 32, 62.5 35 L58 64 C57.5 67, 55 69, 52 69 L28 69 C25 69, 22.5 67, 22 64 L17.5 35 C17 32, 19 30, 22 30 Z" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- Smart Lightning / Fast Checkout Emblem (Center) -->
  <!-- Creates the "A" apex and dynamic "G" forward spark -->
  <path d="M42 26 L29 44 L39 44 L35 62 L53 39 L43 39 Z" fill="#FFFFFF"/>

  <!-- Sparkle Accent (Top Right) -->
  <path d="M57 17 L58.5 21 L62.5 22.5 L58.5 24 L57 28 L55.5 24 L51.5 22.5 L55.5 21 Z" fill="#FFE8A3"/>
</svg>