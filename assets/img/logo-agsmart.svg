<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF5200"/>
    </linearGradient>
    <linearGradient id="textOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7849"/>
      <stop offset="100%" stop-color="#FF5200"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF5200" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#fullBgGrad)" filter="url(#iconShadow)"/>
    <!-- Subtle Inner Border -->
    <rect x="1" y="1" width="42" height="42" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Bag Handle -->
    <path d="M15 17 C15 11, 29 11, 29 17" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Bag Shape Translucent -->
    <path d="M11 18 L33 18 C35 18, 36 19, 35.5 21 L32.5 38 C32 40, 30.5 41, 28.5 41 L15.5 41 C13.5 41, 12 40, 11.5 38 L8.5 21 C8 19, 9 18, 11 18 Z" fill="#FFFFFF" fill-opacity="0.18"/>
    <!-- Smart Lightning / Spark -->
    <path d="M23 15 L15 27 L22 27 L19 38 L30 23 L24 23 Z" fill="#FFFFFF"/>
    <!-- Spark Dot -->
    <circle cx="34" cy="11" r="2" fill="#FFE8A3"/>
  </g>

  <!-- Wordmark "AGSMART" -->
  <g transform="translate(60, 0)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.03em">
      <tspan fill="#0F172A">AG</tspan><tspan fill="url(#textOrangeGrad)">SMART</tspan>
    </text>
    <text x="1" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#94A3B8" letter-spacing="0.22em">
      POINT OF SALE &amp; MART
    </text>
  </g>
</svg>