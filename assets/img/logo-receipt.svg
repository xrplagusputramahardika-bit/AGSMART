<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 68" width="200" height="68">
  <!-- Monochrome Thermal Struk Logo (Optimized for 58mm & 80mm ESC/POS) -->
  <g transform="translate(10, 6)">
    <!-- Solid Black Squircle / Badge -->
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#000000"/>
    
    <!-- White Bag Handle -->
    <path d="M19 20 C19 13, 35 13, 35 20" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- White Dynamic Lightning / Spark Monogram -->
    <path d="M29 17 L19 32 L27 32 L23 45 L37 28 L29 28 Z" fill="#FFFFFF"/>
    
    <!-- Small Star Accent -->
    <polygon points="42,10 43.5,14 47.5,14 44.5,16.5 45.5,20.5 42,18 38.5,20.5 39.5,16.5 36.5,14 40.5,14" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark for Struk -->
  <g transform="translate(74, 8)">
    <text x="0" y="27" font-family="'Courier New', Courier, monospace, 'JetBrains Mono'" font-weight="900" font-size="22" fill="#000000" letter-spacing="1">AGSMART</text>
    <text x="0" y="42" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="9" fill="#000000" letter-spacing="2">SMART RETAIL POS</text>
    <line x1="0" y1="48" x2="114" y2="48" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>
</svg>